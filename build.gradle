plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.diffplug.spotless' version "7.0.4"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mavencraft" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

spotless {
    java {
        palantirJavaFormat('2.103.0')
    }
}

dependencies {
    // Compile-time target for the optional Fantastic Wings compatibility mixin.
    // This jar is not bundled into the MavenCraft output.
    compileOnly files("libs/fantasticwings-v26.3.1.jar")
    compileOnly "maven.modrinth:QAGBst4M:vbwu116x" // Puzzles Lib API for wing attachment access
    // Local run dependencies for testing Fantastic Wings. These stay out of the mod jar.
    runtimeOnly files("libs/fantasticwings-v26.3.1.jar")
    runtimeOnly "maven.modrinth:QAGBst4M:vbwu116x" // Puzzles Lib 26.3.16 Fabric
    runtimeOnly "maven.modrinth:ohNO6lps:JpKvrr9J" // Forge Config API Port 26.3.1 Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:21.0.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
